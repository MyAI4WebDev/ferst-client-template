# Update: keeps this site on the latest engine (ferst-core) and template.
#
# Started by hand (the Actions tab, or the API) when a release should land; in between, the
# site's scheduled agent run applies a waiting update itself. GitHub dispatches workflows from
# a repo's default branch, so this small file lives on `main`. The steps live in the template
# (nightly-update.yml), so a fix there reaches every site without a change to its `main`. They
# work on `dev`, the test copy, and never touch `main`: the live site changes only when a
# person releases the test copy.
#
# Template-owned (ferst-template.json ownedPaths): don't edit it in a site's repo.
name: update

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run the whole update even if nothing is newer (to test the path)
        type: boolean
        default: false

permissions:
  contents: write # push the update to dev
  actions: write # start deploy.yml: a push made with the Action's token starts no workflows
  issues: write # note the update on core-update issues, or report a failure

jobs:
  update:
    uses: MyAI4WebDev/ferst-client-template/.github/workflows/nightly-update.yml@main
    with:
      force: ${{ inputs.force == true }}
